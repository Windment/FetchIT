<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录以提取 Cookie</title>
    <link rel="stylesheet" href="css/variables.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--background-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .extract-bar {
            height: 48px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px 0 16px;
            background: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            -webkit-app-region: drag;
        }
        .extract-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .extract-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-app-region: no-drag;
        }
        .extract-close {
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-quaternary);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .extract-close:hover {
            background: var(--danger-bg);
            color: var(--danger-color);
        }
        .extract-done {
            height: 32px;
            padding: 0 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
            border-radius: 9999px;
            background: var(--primary-color);
            color: var(--on-primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }
        .extract-done:hover {
            background: var(--primary-hover);
        }
        .extract-done:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .extract-webview {
            flex: 1;
            width: 100%;
            border: none;
            display: flex;
        }
        .extract-toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%) translateY(16px);
            max-width: 80%;
            padding: 10px 18px;
            background: var(--background-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 13px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 10;
        }
        .extract-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="extract-bar">
        <span class="extract-title" id="extractTitle">登录以提取 Cookie</span>
        <div class="extract-actions">
            <button class="extract-done" id="extractDoneBtn" type="button">完成</button>
            <button class="extract-close" id="extractCloseBtn" title="关闭">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
    </div>
    <webview class="extract-webview" id="extractWebview" allowpopups></webview>
    <div class="extract-toast" id="extractToast"></div>
    <script>
        const { ipcRenderer } = require('electron');

        const params = new URLSearchParams(location.search);
        const targetUrl = params.get('url') || 'https://example.com';
        const hostname = params.get('hostname') || '';
        const partition = params.get('partition') || 'cookie-extract-default';
        const theme = params.get('theme') || 'dark';
        const primaryColor = params.get('primaryColor') || '#0078d4';

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function getOnColor(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminance > 0.5 ? '#1d1b20' : '#ffffff';
        }

        function adjustColorBrightness(hex, amount) {
            const r = Math.max(0, Math.min(255, parseInt(hex.slice(1, 3), 16) + amount));
            const g = Math.max(0, Math.min(255, parseInt(hex.slice(3, 5), 16) + amount));
            const b = Math.max(0, Math.min(255, parseInt(hex.slice(5, 7), 16) + amount));
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        function applyPrimaryColor(color) {
            document.documentElement.style.setProperty('--primary-color', color);
            document.documentElement.style.setProperty('--primary-hover', adjustColorBrightness(color, -20));
            document.documentElement.style.setProperty('--primary-active', adjustColorBrightness(color, -40));
            document.documentElement.style.setProperty('--primary-light', hexToRgba(color, 0.2));
            document.documentElement.style.setProperty('--primary-lighter', hexToRgba(color, 0.08));
            document.documentElement.style.setProperty('--on-primary', getOnColor(color));
            document.documentElement.style.setProperty('--shadow-primary', `0 1px 3px ${hexToRgba(color, 0.32)}`);
        }

        document.documentElement.setAttribute('data-theme', theme);
        applyPrimaryColor(primaryColor);

        const titleEl = document.getElementById('extractTitle');
        const webview = document.getElementById('extractWebview');
        const doneBtn = document.getElementById('extractDoneBtn');
        const closeBtn = document.getElementById('extractCloseBtn');
        const toast = document.getElementById('extractToast');

        let toastTimer = null;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
                toastTimer = null;
            }, 2600);
        }

        if (hostname) {
            titleEl.textContent = '登录 ' + hostname;
        }

        webview.partition = partition;
        webview.src = targetUrl;

        doneBtn.addEventListener('click', () => {
            doneBtn.disabled = true;
            ipcRenderer.send('cookie-extract-finish');
        });

        closeBtn.addEventListener('click', () => {
            ipcRenderer.send('close-extract-window');
        });

        ipcRenderer.on('cookie-extract-result', (_event, result) => {
            doneBtn.disabled = false;
            if (result && result.ok) {
                showToast('已提取到 Cookie 池：' + result.name);
                setTimeout(() => ipcRenderer.send('close-extract-window'), 900);
            } else {
                let message = '提取失败';
                if (result && result.error === 'no-cookies') message = '未检测到 Cookie，请确认已登录';
                else if (result && result.error === 'write-failed') message = '写入 Cookie 池失败';
                else if (result && result.error === 'read-failed') message = '读取 Cookie 失败';
                showToast(message);
            }
        });
    </script>
</body>
</html>
